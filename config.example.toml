# Pubky TLS Proxy
#
# Start the proxy without editing this file. To change a setting, remove the
# "# " at the start of its line and edit the value.
#
# Command-line options take precedence over this file. Relative file paths
# are resolved from the directory containing this config.toml.
# More detail: https://github.com/pubky/pubky-tls-proxy/blob/main/docs/configuration.md


# Secret key
# ----------
# The proxy creates this secret key on first start and reuses it thereafter.
# Back it up to retain control of your Public Key Domain.
# secret_key_file = "secret"


# Where traffic goes
# ------------------
# Address and port the proxy accepts connections on.
# Add another address to the list if you want it to listen on multiple ports.
# listen_addrs = ["0.0.0.0:8443"]

# Plain HTTP and decrypted raw public key TLS go to this HTTP backend.
# http_backend_addr = "127.0.0.1:6286"

# Certificate-based HTTPS and unparseable TLS handshakes go to this backend unchanged.
# No TLS passthrough backend is configured by default, so those connections are rejected.
# tls_passthrough_backend_addr = "127.0.0.1:6443"

# Set to false to reject plain HTTP. Raw public key TLS still reaches the HTTP backend.
# plain_http = true

# The proxy sends the client's address to backends using a PROXY protocol v1 header.
# Set to false if your backend is not configured to accept that header.
# proxy_protocol = true


# Connection limits
# -----------------
# Maximum number of simultaneous client connections.
# max_connections = 1024

# Time limits in seconds. Each must be greater than zero.
# rpk_handshake_timeout_secs = 10  # Complete a raw public key (RPK) TLS handshake
# backend_setup_timeout_secs = 10 # Connect to a backend and send its PROXY protocol header
# idle_timeout_secs = 300         # No traffic in either direction


# Publishing the PKARR packet
# ---------------------------
# To publish records directly, create dns-records.toml beside this file with an
# A record for your public address and an HTTPS record for the proxy's port.
# `pubky-tls-proxy init` can prepare these records without publishing them.
# Review the public address and port before starting the proxy.
# The proxy publishes valid edits automatically. Without that file, it
# republishes an externally published PKARR packet unchanged (external-packet mode).
# Leave this on unless another service handles publishing.
[pkarr]
# publish = true
# dns_records_file = "dns-records.toml" # optional; detected beside this file
# republish_interval_secs = 3600        # One hour between republish runs
# packet_cache_file = "pkarr-packet.cache"


# Where to publish and republish
# ------------------------------
# By default, the proxy uses both the Mainline DHT and PKARR relays.
# Setting either list replaces its defaults. Use [] to disable that network.
# Do not disable both networks while publishing is enabled.
# dht_bootstrap_nodes = ["router.bittorrent.com:6881"]
# relay_urls = ["https://pkarr.pubky.app"]
